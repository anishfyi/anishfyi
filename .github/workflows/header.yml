name: Refresh README header

# Redraws the header SVGs once a day so the contribution graph and count stay current.
# The build fetches its fonts from velofy.co and jsDelivr and falls back to the copies
# embedded in the last build, so a host being down never fails the refresh.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [header/build.py]

permissions:
  contents: write

concurrency:
  group: header
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python3 header/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git add header
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the README header"
          git push
